<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carly - Anna Topping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Sixtyfour:wght@400&display=swap" rel="stylesheet">
    <style>
        @keyframes colorCycle {
            0% { background-color: orange; }
            10% { background-color: emerald; }
            20% { background-color: tomato; }
            30% { background-color: blush; }
            40% { background-color: red; }
            50% { background-color: skyblue; }
            60% { background-color: burgundy; }
            70% { background-color: lightyellow; }
            80% { background-color: beige; }
            90% { background-color: limegreen; }
            100% { background-color: orange; }
        }
        
        body {
            font-family: 'Sixtyfour', monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: colorCycle 100s infinite;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: clamp(3rem, 15vw, 12rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            color: white;
            margin: 0 0 3rem 0;
            line-height: 1;
            font-family: 'Sixtyfour', monospace;
        }
        
        .back-link {
            color: white;
            text-decoration: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 2rem;
            display: inline-block;
            transition: opacity 0.3s ease;
        }
        
        .back-link:hover {
            opacity: 0.7;
        }
        
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            margin-top: 2rem;
        }
        
        .photo-item {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .container {
                padding: 1rem;
                max-width: 100%;
            }
            
            h1 {
                margin: 0 0 2rem 0;
                font-size: clamp(2.5rem, 20vw, 8rem);
            }
            
            .photo-gallery {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0.75rem;
            }
            
            .container {
                padding: 0.75rem;
            }
            
            h1 {
                margin: 0 0 1.5rem 0;
                font-size: clamp(2rem, 18vw, 6rem);
                letter-spacing: 0.03em;
            }
            
            .photo-gallery {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← back</a>
        <h1>CARLY</h1>
        <div class="photo-gallery">
            <div class="photo-item">
                <img src="images/carly/000003810007.jpg" alt="Carly">
            </div>
            <div class="photo-item">
                <img src="images/carly/IMG_0355.jpg" alt="Carly">
            </div>
            <div class="photo-item">
                <img src="images/carly/IMG_0752.jpg" alt="Carly">
            </div>
            <div class="photo-item">
                <img src="images/carly/IMG_3920.jpg" alt="Carly">
            </div>
            <div class="photo-item">
                <img src="images/carly/IMG_4620.jpg" alt="Carly">
            </div>
            <div class="photo-item">
                <img src="images/carly/IMG_5441.jpg" alt="Carly">
            </div>
            <div class="photo-item">
                <img src="images/carly/IMG_9305.jpg" alt="Carly">
            </div>
            <div class="photo-item">
                <img src="images/carly/IMG_9954.jpg" alt="Carly">
            </div>
        </div>
    </div>
</body>
</html>
