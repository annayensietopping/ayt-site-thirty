<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna Topping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Sixtyfour:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dist/output.css">
    <style>
        body {
            font-family: 'Sixtyfour', monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 1s ease-in-out;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: clamp(3rem, 15vw, 12rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            color: white;
            margin: 0 0 3rem 0;
            line-height: 1;
            font-family: 'Sixtyfour', monospace;
        }
        
        .text-box {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 2rem;
            color: white;
            font-size: 1.125rem;
            line-height: 1.8;
            font-weight: 300;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            width: 100%;
            box-sizing: border-box;
        }
        
        .footer {
            max-width: 800px;
            width: 100%;
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 0 2rem;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            transition: opacity 0.3s ease;
        }
        
        .footer a:hover {
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .container {
                padding: 1rem;
                max-width: 100%;
            }
            
            h1 {
                margin: 0 0 2rem 0;
                font-size: clamp(2.5rem, 20vw, 8rem);
            }
            
            .text-box {
                padding: 1.5rem;
                font-size: 1rem;
                line-height: 1.7;
            }
            
            .footer {
                padding: 0;
                margin-top: 2rem;
                flex-wrap: wrap;
                gap: 1.5rem;
                justify-content: center;
            }
            
            .footer a {
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0.75rem;
            }
            
            .container {
                padding: 0.75rem;
            }
            
            h1 {
                margin: 0 0 1.5rem 0;
                font-size: clamp(2rem, 18vw, 6rem);
                letter-spacing: 0.03em;
            }
            
            .text-box {
                padding: 1.25rem;
                font-size: 0.95rem;
                line-height: 1.6;
            }
            
            .footer {
                margin-top: 1.5rem;
                gap: 1.25rem;
            }
            
            .footer a {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ANNA</h1>
        <div class="text-box">
            <p>I'm a Sales Engineer at Datadog. I live in Somerville, Massachusetts.</p>
        </div>
        <footer class="footer">
            <a href="mailto:itsannatopping@gmail.com">email</a>
            <a href="https://www.linkedin.com/in/anna-topping/" target="_blank">linkedin</a>
            <a href="https://github.com/annayensietopping/ayt-site">legacy</a>
            <a href="carly.html">carly</a>
        </footer>
    </div>

    <script>
        // Array of colors to cycle through
        const colors = [
            'orange',
            'emerald',
            'lilac',
            'blush',
            'darkred',
            'skyblue',
            'burgundy',
            'darkyellow',
            'darkbrown',
            'lightgreen',
        ];
        
        // Start with a random color
        let currentColorIndex = Math.floor(Math.random() * colors.length);
        
        function changeBackgroundColor() {
            document.body.style.backgroundColor = colors[currentColorIndex];
            currentColorIndex = (currentColorIndex + 1) % colors.length;
        }
        
        // Change color immediately on load
        changeBackgroundColor();
        
        // Change color every minute (60000 milliseconds)
        setInterval(changeBackgroundColor, 15000);
    </script>
</body>
</html>
